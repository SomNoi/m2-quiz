], "a": 1, "e": "4 × 50,000 = 200,000 เซนติเมตร = 2,000 เมตร = 2 กิโลเมตร"}, {"s": "ภูมิศาสตร์ (ทวีปยุโรปและแอฟริกา)", "q": "คลองสุเอซตั้งอยู่ในประเทศใด และเชื่อมทะเลใด", "o": ["อียิปต์ – เชื่อมทะเลเมดิเตอร์เรเนียนกับทะเลแดง", "โมร็อกโก – เชื่อมมหาสมุทรแอตแลนติกกับทะเลเมดิเตอร์เรเนียน", "ตุรกี – เชื่อมทะเลดำกับทะเลเมดิเตอร์เรเนียน", "ปานามา – เชื่อมมหาสมุทรแปซิฟิกกับมหาสมุทรแอตแลนติก"], "a": 0, "e": "คลองสุเอซอยู่ในอียิปต์ เชื่อมทะเลเมดิเตอร์เรเนียนกับทะเลแดง ทำให้เรือเดินทางระหว่างยุโรปกับเอเชียได้สั้นลง"}, {"s": "ภูมิศาสตร์ (ทวีปยุโรปและแอฟริกา)", "q": "ชายฝั่งฟยอร์ด (fjord) ซึ่งเกิดจากการกัดเซาะของธารน้ำแข็ง พบมากที่สุดในประเทศใดของยุโรป", "o": ["อิตาลี", "สเปน", "กรีซ", "นอร์เวย์"], "a": 3, "e": "ชายฝั่งทางตะวันตกของนอร์เวย์มีฟยอร์ดจำนวนมาก เกิดจากธารน้ำแข็งกัดเซาะหุบเขาแล้วน้ำทะเลท่วมเข้ามา"}];
var L=["ก","ข","ค","ง"];
// instant-feedback mode: each question locks and shows its answer as soon as it is tapped
var N=DATA.length, ans=[];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function build(){
  var h="",last="";
  for(var i=0;i<N;i++){
    var d=DATA[i];
    if(d.s!==last){h+='<div class="sec">'+esc(d.s)+'</div>';last=d.s;}
    h+='<div class="card" id="c'+i+'"><div class="qt">'+(i+1)+'. '+esc(d.q)+'</div>';
    for(var j=0;j<4;j++){
      h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onclick="answerNow('+i+','+j+')"><span class="lt">'+L[j]+'</span>'+esc(d.o[j])+'<span class="mk" id="m'+i+'_'+j+'"></span></label>';
    }
    h+='<div class="fb" id="f'+i+'"></div></div>';
  }
  document.getElementById("quiz").innerHTML=h;
}
function counts(){var a=0,c=0;for(var i=0;i<N;i++){if(ans[i]!==undefined){a++;if(ans[i]===DATA[i].a)c++;}}return {a:a,c:c};}
function bar(){var t=counts();document.getElementById("prog").innerHTML="ถูก "+t.c+" / ตอบแล้ว "+t.a+" / "+N;return t;}
function answerNow(i,j){
  if(ans[i]!==undefined)return;
  ans[i]=j;
  var d=DATA[i],ok=(j===d.a);
  for(var k=0;k<4;k++){
    var cls="opt";
    if(k===d.a)cls+=" right"; else if(k===j)cls+=" wrong";
    document.getElementById("o"+i+"_"+k).className=cls;
    document.getElementById("m"+i+"_"+k).innerHTML=(k===d.a)?"✓":((k===j)?"✗":"");
  }
  var ins=document.getElementsByName("q"+i);for(var m=0;m<ins.length;m++)ins[m].disabled=true;
  document.getElementById("c"+i).className="card done "+(ok?"ok":"bad");
  document.getElementById("f"+i).innerHTML=(ok?"✅ ถูกต้อง!":"❌ ยังไม่ถูก — คำตอบที่ถูกคือ <b>"+L[d.a]+". "+esc(d.o[d.a])+"</b>")+"<br>💡 "+esc(d.e);
  var t=bar();
  if(t.a===N)finish(t.c);
}
function finish(score){
  var pct=Math.round(score*100/N);
  var msg=pct>=80?"เยี่ยมมาก! พร้อมสอบแล้ว 🎉":(pct>=60?"ดีแล้ว ทบทวนข้อที่ผิดอีกนิด 💪":"ค่อย ๆ อ่านคำอธิบายข้อที่ผิด แล้วลองทำใหม่นะ 📚");
  var r=document.getElementById("result");
  r.innerHTML='<div>ทำครบ 35 ข้อแล้ว · คะแนนรวม</div><div class="big">'+score+' / '+N+'</div><div>('+pct+'%) '+msg+'</div>';
  r.style.display="block";
  document.getElementById("retry").className="btn alt";
  if(r.scrollIntoView)r.scrollIntoView();
}
function reset(){
  ans=[];
  document.getElementById("result").style.display="none";
  document.getElementById("retry").className="btn alt hide";
  build();bar();window.scrollTo(0,0);
}
document.getElementById("retry").onclick=reset;
build();
</script>
